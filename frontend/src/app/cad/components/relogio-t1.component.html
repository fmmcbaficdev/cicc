<div
  class="relogio-t1"
  [class.relogio-t1--compacto]="compacto()"
  role="timer"
  [attr.aria-label]="rotulo() + ' ' + decorrido()"
>
  <svg class="relogio-t1__icone" viewBox="0 0 32 32" aria-hidden="true">
    <circle class="relogio-t1__aro" cx="16" cy="16" r="13.5" />
    <line class="relogio-t1__marca" x1="16" y1="4.5" x2="16" y2="7.2" />
    <line class="relogio-t1__marca" x1="16" y1="24.8" x2="16" y2="27.5" />
    <line class="relogio-t1__marca" x1="4.5" y1="16" x2="7.2" y2="16" />
    <line class="relogio-t1__marca" x1="24.8" y1="16" x2="27.5" y2="16" />
    <line class="relogio-t1__hora" x1="16" y1="16" x2="16" y2="10" />
    <line class="relogio-t1__minuto" x1="16" y1="16" x2="22.2" y2="16" />
    <circle class="relogio-t1__eixo" cx="16" cy="16" r="1.4" />
  </svg>
  <div>
    <p class="relogio-t1__selo">{{ rotulo() }}</p>
    <p class="relogio-t1__tempo">{{ decorrido() }}</p>
    @if (!compacto()) {
      <p class="relogio-t1__inicio">Início {{ inicioFormatado() }}</p>
    }
  </div>
</div>
